<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- jisme humko in future changes karne hoge usko  he id dete hai so that
     we can access then in js -->
    <h1>Rock Paper Scissors</h1>
    <div class="choices">
        <div class="choice" id="rock">
            <img src="./images/rock.png" alt="Rock icon" >
        </div>
        <div class="choice" id="paper">
            <img src="./images/paper.png" alt="paper icon" >
        </div>
        <div class="choice" id="sicssor">
            <img src="./images/scissor.png" alt="scissor icon" >
        </div>
    </div>

    <div class="score-board">
        <div class="score">
            <p id="user-score">0</p>
            <p>You</p>
        </div>
        <div class="score">
            <p id="computer-score">0</p>
            <p>computer</p>
        </div>
    </div>

    <div class="message-box">
        <p id="message">play your move</p>
    </div>
    <div class="reset">
        <button id="reset-btn">Reset</button>
    </div>
    <script src="index.js"></script>
</body>
</html>
